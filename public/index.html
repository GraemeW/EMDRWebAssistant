<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EMDR Web Assistant</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ===================== LANDING ===================== -->
<section id="landing" class="screen">
  <div class="landing-card">
    <h1 class="wordmark">EMDR Web Assistant<span class="dot">.</span></h1>

    <div class="join-block">
      <label for="director-passphrase">Director Login</label>
      <div class="input-row">
        <input id="director-passphrase" type="password" autocomplete="off" placeholder="Enter the director login" />
        <button id="btn-join-admin" class="btn btn-primary">Start session</button>
      </div>
      <p class="input-hint" id="admin-hint"></p>
    </div>

    <div class="divider"><span>or</span></div>

    <button id="btn-join-viewer" class="btn btn-secondary btn-wide">Join session</button>
    <p id="viewer-hint" class="input-hint"></p>
  </div>
</section>

<!-- ===================== SESSION ===================== -->
<section id="session" class="screen hidden">
  <header class="topbar">
    <span class="wordmark small">EMDR Web Assistant<span class="dot">.</span></span>
    <span id="role-badge" class="badge">viewer</span>
    <span id="director-status" class="status-pill"></span>
  </header>

  <main class="stage-wrap">
    <div id="stage" class="stage">
      <div id="bobble" class="bobble"></div>
    </div>
  </main>

  <!-- Admin control dock: hidden entirely for viewers -->
  <aside id="controls" class="controls hidden">
    <div class="control-group">
      <button id="btn-toggle-run" class="btn btn-primary btn-wide">Pause</button>
      <button id="btn-reset" class="btn btn-ghost btn-wide">Reset to defaults</button>
    </div>

    <div class="control-group">
      <span class="control-label">Shape</span>
      <div class="shape-row">
        <button class="btn shape-btn" data-shape="circle" aria-label="Circle">●</button>
        <button class="btn shape-btn" data-shape="square" aria-label="Square">■</button>
        <button class="btn shape-btn" data-shape="triangle" aria-label="Triangle">▲</button>
      </div>
    </div>

    <div class="control-group">
      <label class="control-label" for="size-slider">Size</label>
      <input type="range" id="size-slider" min="0" max="1" step="0.01">
    </div>

    <div class="control-group">
      <label class="control-label" for="speed-slider">Speed</label>
      <input type="range" id="speed-slider" min="0" max="1" step="0.01">
    </div>

    <div class="control-group">
      <label class="control-label" for="range-slider">Travel range</label>
      <input type="range" id="range-slider" min="0" max="1" step="0.01">
    </div>

    <div class="control-group two-col">
      <div>
        <label class="control-label" for="bobble-color">Bobble color</label>
        <input type="color" id="bobble-color">
      </div>
      <div>
        <label class="control-label" for="background-color">Background</label>
        <input type="color" id="background-color">
      </div>
    </div>

    <div class="control-group">
      <button id="btn-fullscreen" class="btn btn-ghost btn-wide">Toggle fullscreen (this device)</button>
    </div>
  </aside>
</section>

<script type="module" src="client/client.js"></script>
</body>
</html>
